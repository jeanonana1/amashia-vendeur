# Compile l'application Android « Amashia Seller » (tableau de bord vendeur + alertes Firebase)
# quand le message de commit contient [apk], ou sur lancement manuel. L'APK est publié sur le site :
# https://amashia-vendeur.vercel.app/download/amashia-seller.apk
name: APK Amashia Seller

on:
  push:
    branches: [main]
    paths-ignore: ["public/download/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install --no-audit --no-fund
      - run: npx cap sync android
      - name: Compiler l'APK
        working-directory: android-app/android
        env:
          APP_BUILD: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Publier l'APK sur le site
        working-directory: .
        run: |
          mkdir -p public/download
          cp android-app/android/app/build/outputs/apk/release/app-release.apk public/download/amashia-seller.apk
          jq -n --argjson build "${{ github.run_number }}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson size "$(stat -c %s public/download/amashia-seller.apk)" --arg sha "${GITHUB_SHA::7}" \
            '{build:$build,date:$date,size:$size,sha:$sha}' > public/download/amashia-seller.json
          cat public/download/amashia-seller.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/download/amashia-seller.apk public/download/amashia-seller.json
          git commit -m "APK Amashia Seller mis à jour (${GITHUB_SHA::7})" || exit 0
          # fichiers régénérés par la compilation : on ne les envoie pas
          git stash --include-untracked || true
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: amashia-seller-apk
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
